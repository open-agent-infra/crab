# Engine-only SDK config derived from
# benchmarks/examples/iflow/iflow.fault.auto.madoka.mini.yaml.
#
# This intentionally omits benchmark/user workload concerns such as scenario,
# dataset, agent, LLM service, phase workers, iterations, CSV output, and
# replay options. The SDK example owns task selection and uses an external LLM
# replay service; this file only configures the in-process Crab engine.

runtime: runc
run_id: sdk-iflow-replay-runc
default_image: ubuntu:22.04

# Similar to the benchmark's max_workers: 2, but scoped to the engine.
max_workers: 2

network:
  enable_sandbox_network: true
  expected_sandboxes: 2

interceptor:
  enabled: true
  host: 127.0.0.1
  port: 0

forwarder:
  host: 127.0.0.1
  port: 0

# Benchmark YAML says zpool_name: crab-300. The SDK engine takes the more
# direct runtime-manager form: a dataset prefix under that pool.
zfs_dataset_prefix: crab/iflow-replay

# Keep SDK engine data out of /tmp so successful runs leave inspectable state.
storage_planes:
  runtime_root: /var/lib/crab/examples/iflow-replay/runtime
  storage_root: /var/lib/crab/examples/iflow-replay/checkpoints
  agent_state_root: /var/lib/crab/examples/iflow-replay/agent-state
  work_dir_host_root: /var/lib/crab/examples/iflow-replay/work
  image_cache_root: /var/lib/crab/examples/iflow-replay/image-cache

executor:
  max_workers: 2
  checkpoint_workers: 2
  restore_workers: 2
  checkpoint_queue_size: 10000
  max_retries: 0
  retry_backoff_seconds: 0.05
  coordination_workers: 2
  composite_step_workers: 2

scheduler:
  min_checkpoint_interval_seconds: 0.0
  force_checkpoint_after_seconds: 0.0
  require_change_signal: true
  checkpoint_full_baseline_on_first_checkpoint: true
  prefer_checkpoint_during_llm_request: true
  require_llm_request_for_checkpoint: false
  inspect_without_pause: false
  incremental_process_enabled: true
  full_process_checkpoint_interval: 8
  max_process_chain_length: 16

# Launch the real host inspector as a subprocess so the engine sees actual
# eBPF process/filesystem change signals. `in_process` falls back to the
# fake EBPFSandboxInspector (no real events — fine for unit tests).
host_inspector:
  launch_mode: process
  host: 127.0.0.1
  port: 0
  log_level: DEBUG
  log_file: /var/lib/crab/examples/iflow-replay/logs/host-inspector.log

runc:
  command_timeout_seconds: 120.0
  zfs_prepare_timeout_seconds: 300.0
  checkpoint:
    tcp_established: true
    shell_job: true
    tcp_skip_in_flight: true
    ext_unix_sk: true
  restore:
    detach: true
    tcp_established: true
    shell_job: true
    ext_unix_sk: true
    lazy_pages: false

telemetry:
  output: /var/lib/crab/examples/iflow-replay/logs/telemetry.jsonl
  detail_level: detailed
  capture_command_output: false
  max_text_attribute_bytes: 2048
  keep_in_memory_copy: false
  writer_mode: async
  queue_capacity: 16384000
  batch_max_records: 256000
  flush_interval_ms: 50
  overflow_policy: drop_new
  serializer: auto

logging:
  file: /var/lib/crab/examples/iflow-replay/logs/engine.log
  level: debug
  file_mode: write

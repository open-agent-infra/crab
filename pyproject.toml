[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crab"
version = "0.1.0"
description = "Fault-tolerant agent execution via process and filesystem checkpointing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{ name = "Crab contributors" }]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
tls = ["cryptography>=3.1"]

[project.urls]
Homepage = "https://github.com/open-agent-infra/crab"
Repository = "https://github.com/open-agent-infra/crab.git"
Documentation = "https://github.com/open-agent-infra/crab/tree/main/docs"
Issues = "https://github.com/open-agent-infra/crab/issues"
Paper = "https://arxiv.org/abs/2604.28138"

[project.scripts]
# Operator CLI — talks to the daemon over the Unix-domain socket.
# Subcommands: daemon start/stop/status, info, sandbox run/ls/rm/exec/fork/stop/pause/resume,
# checkpoint create/ls/rm/restore, txn begin/commit/abort/status. See `crab --help`.
crab = "crab.cli:main"

# Daemon entry point. Equivalent to `python -m crab.daemon`.
# Typically wrapped by a systemd unit; for development, prefer
# `crab daemon start [--foreground]`.
crabd = "crab.daemon.server:main"

# Service gateway (track S). Equivalent to `python -m crab.gateway`.
# `crab-gateway serve` runs the process; `tenants`/`keys`/`quotas`
# subcommands administer a running gateway over its local Unix socket.
crab-gateway = "crab.gateway.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crab*", "integrations*", "benchmarks*"]
exclude = ["integrations.sandboxes.iflow.cache.prepared-runtimes*"]

[tool.setuptools.package-data]
"crab" = ["host_inspector/bpf/*"]
"integrations.sandboxes.iflow" = ["Dockerfile", "cache/*.tar.xz", "cache/*.tgz"]
